### A compound-failure rehearsal: an emergency plus things going wrong at the same time.
class: StressScenario
table: stress_scenario
fields:
  campusId: int, relation(parent=campus, onDelete=Restrict)
  code: String
  name: String
  description: String
  zoneCode: String
  eventType: EventType
  ### Local hour the emergency happens at (policies are time-aware).
  hour: int
  failures: List<StressFailure>
  builtIn: bool, default=false
indexes:
  stress_scenario_campus_code_idx:
    fields: campusId, code
    unique: true
