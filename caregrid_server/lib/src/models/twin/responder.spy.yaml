### A dispatchable response unit: security desk, patrol, ambulance, ER team, facilities or fire safety.
class: Responder
table: responder
fields:
  campusId: int, relation(parent=campus, onDelete=Restrict)
  code: String
  name: String
  type: ResponderType
  status: ResponderStatus, default=available
  ### Zone the unit is at right now.
  zoneCode: String
  ### Zone the unit returns to after a task.
  baseZoneCode: String
  speedMetersPerMin: int
  ### Time from accepting a task to starting to move.
  mobilizationSeconds: int
  capabilities: List<String>
  contact: String
  activeDispatchId: int?
  ### Note shown when the unit is busy or offline, e.g. 'Inter-hospital transfer'.
  statusNote: String?
indexes:
  responder_campus_code_idx:
    fields: campusId, code
    unique: true
