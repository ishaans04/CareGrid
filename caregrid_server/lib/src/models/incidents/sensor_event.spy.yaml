### A normalized signal from the edge event bus: camera inference, SOS, access control, vehicle or IoT.
class: SensorEvent
table: sensor_event
fields:
  campusId: int, relation(parent=campus, onDelete=Restrict)
  source: SignalSource
  eventType: EventType
  zoneCode: String
  cameraCode: String?
  trackId: String?
  confidence: double
  detail: String?
  locationDetail: String?
  observedAt: DateTime
  receivedAt: DateTime
  ### Incident this signal created or joined.
  incidentId: int?
  ### What the agent did with the signal, e.g. 'Corroborated INC-1042'.
  outcome: String?
  contextHour: int?
  scenarioRunId: int?
  reporterUserId: int?, scope=serverOnly
  ### Producer's event id, when supplied. Unique per campus and source.
  sourceEventId: String?
indexes:
  sensor_event_incident_idx:
    fields: incidentId
  sensor_event_source_event_idx:
    fields: campusId, source, sourceEventId
    unique: true
  sensor_event_campus_idx:
    fields: campusId, receivedAt
