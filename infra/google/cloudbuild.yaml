# Build/push only. This pipeline never deploys or executes database jobs.
# Submit from the repository root with the dedicated build service account.
steps:
  - id: server
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - caregrid_server/Dockerfile
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${_IMAGE_TAG}"
      - .
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - caregrid_web/Dockerfile
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${_IMAGE_TAG}"
      - .
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${_IMAGE_TAG}"
substitutions:
  _REGION: asia-south1
  _REPOSITORY: caregrid-demo-images
  _IMAGE_TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
