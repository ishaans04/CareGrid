name: Google infrastructure checks
on:
  push:
    branches: [main, duality/google-infrastructure]
    paths:
      [
        "infra/google/**",
        ".gcloudignore",
        ".dockerignore",
        ".github/workflows/google-infrastructure.yml",
      ]
  pull_request:
    paths:
      [
        "infra/google/**",
        ".gcloudignore",
        ".dockerignore",
        ".github/workflows/google-infrastructure.yml",
      ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/google
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      # Provider mocks: no credentials, API calls or billable resources.
      - run: terraform test
