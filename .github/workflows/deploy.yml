name: Legacy Serverpod Cloud deploy (manual)

# Historical non-Google deployment path, retained for reference only.
# Automatic deployment is disabled for the Google Cloud buildathon architecture.
# Manual runs require a SERVERPOD_CLOUD_TOKEN
# secret (serverpod cloud auth create-token) and scloud.yaml is committed
# (created by `serverpod cloud launch`). Without the secret the job is skipped.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVERPOD_CLOUD_TOKEN: ${{ secrets.SERVERPOD_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        if: env.SERVERPOD_CLOUD_TOKEN != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Install dependencies and Serverpod CLI
        if: env.SERVERPOD_CLOUD_TOKEN != ''
        run: |
          flutter pub get
          dart pub global activate serverpod_cli 4.0.4

      - name: Deploy
        if: env.SERVERPOD_CLOUD_TOKEN != ''
        uses: serverpod/serverpod_cloud_deploy@v1
        with:
          token: ${{ secrets.SERVERPOD_CLOUD_TOKEN }}
